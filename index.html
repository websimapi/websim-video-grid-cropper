<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Grid Cropper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <h1>Video Grid Cropper</h1>
        <p>Upload a video, choose your grid size, and get cropped clips!</p>
        
        <section id="controls">
            <input type="file" id="video-upload" accept="video/*">
            <div class="grid-inputs">
                <div>
                    <label for="rows">Rows:</label>
                    <input type="number" id="rows" value="2" min="1" max="10">
                </div>
                <div>
                    <label for="cols">Columns:</label>
                    <input type="number" id="cols" value="2" min="1" max="10">
                </div>
            </div>
            <button id="crop-button" disabled>Select a video first</button>
        </section>

        <section id="preview-section" class="hidden">
            <h2>Original Video</h2>
            <div id="video-container"></div>
        </section>

        <section id="results-section" class="hidden">
            <h2>Cropped Videos</h2>
            <div id="results-container"></div>
        </section>

        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p id="loader-message"></p>
            <div id="progress-container" class="hidden">
                <div class="progress-label">Progress:</div>
                <div class="progress-bar-wrapper">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="importmap">
    {
      "imports": {}
    }
    </script>
    <script type="module" src="script.js"></script>

</body>
</html>
